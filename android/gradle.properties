org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Оптимизированное удаление неиспользуемых ресурсов вместе с R8 (совет Play
# Console). В AGP 9 включено по умолчанию и называется
# android.r8.optimizedResourceShrinking, но Flutter 3.38 с AGP 9 не
# собирается, поэтому включаем флагом AGP 8.9. Ресурсы, которые код ищет по
# имени, держит res/raw/keep.xml.
android.r8.optimizedShrinking=true
